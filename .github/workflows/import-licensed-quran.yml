name: Import licensed QuranEnc additions — complete offline editions
on:
  push:
    branches: [content/licensed-quran-media-2026-11]
    paths:
      - '.github/workflows/import-licensed-quran.yml'
      - 'mobile/tools/import_approved_quranenc_editions.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer-editions:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download official publisher archives, validate all 6,236 verses per edition
        working-directory: mobile
        run: python3 tools/import_approved_quranenc_editions.py
      - name: Verify all 13 complete Quran editions and source hashes
        working-directory: mobile
        run: |
          python3 tools/import_quranenc_translations.py --verify-only
          python3 tools/import_approved_quranenc_editions.py --verify-only
      - name: Commit reviewed editions with source provenance to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/assets/quran/translations/
          if ! git diff --cached --quiet; then
            git commit -m "Import Bosnian, German and Kurdish QuranEnc editions with verified hashes"
            git push origin HEAD:content/licensed-quran-media-2026-11
          fi
