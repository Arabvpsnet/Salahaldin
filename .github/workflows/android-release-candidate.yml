name: Android native build — Salahaldin release candidate
on:
  push:
    branches: [integration/salahaldin-laravel13-quran-2026, hardening/salahaldin-release-gates-2026, integration/salahaldin-offline-recitation-2026]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-release-candidate.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Fetch locked Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and compile Android debug APK without changing dependencies
        working-directory: mobile
        env:
          ORG_GRADLE_PROJECT_salatimePreview: 'true'
        run: |
          flutter analyze --no-pub
          flutter build apk --debug --no-pub
      - name: Upload debug APK for QA
        uses: actions/upload-artifact@v4
        with:
          name: salahaldin-android-debug-qa
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
