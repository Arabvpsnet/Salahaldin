name: Refresh compatible dependency locks (review branch)
on:
  push:
    branches: [dependencies/safe-patch-refresh]
    paths:
      - '.github/workflows/refresh-dependencies.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compatible-updates:
    if: github.repository == 'Arabvpsnet/Salahaldin'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh TV npm within declared ranges and test
        shell: bash
        run: |
          cp tv/package-lock.json /tmp/tv-package-lock.json
          (
            cd tv
            npm audit fix --package-lock-only --ignore-scripts || true
            npm ci --ignore-scripts
            npm run typecheck
            npm test
            npm run build
          ) && echo "TV compatible lock update accepted" >> "$GITHUB_STEP_SUMMARY" || {
            cp /tmp/tv-package-lock.json tv/package-lock.json
            echo "TV dependency update reverted after failing validation" >> "$GITHUB_STEP_SUMMARY"
          }
      - name: Refresh server npm within declared ranges and test build
        shell: bash
        run: |
          cp server/package-lock.json /tmp/server-package-lock.json
          (
            cd server
            npm audit fix --package-lock-only --ignore-scripts || true
            npm ci --ignore-scripts
            npm run build
          ) && echo "Server JS compatible lock update accepted" >> "$GITHUB_STEP_SUMMARY" || {
            cp /tmp/server-package-lock.json server/package-lock.json
            echo "Server JS dependency update reverted after failing validation" >> "$GITHUB_STEP_SUMMARY"
          }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, intl, gd, zip, pdo_mysql, bcmath
      - name: Refresh Composer within current major constraints
        shell: bash
        run: |
          cp server/composer.lock /tmp/server-composer-lock.json
          (
            cd server
            composer update --no-interaction --no-scripts --no-plugins --with-all-dependencies
            composer validate --no-check-publish
            php -l app/Http/Controllers/Quran/PrayerTime/PrayerTimeImportController.php
          ) && echo "Composer compatible lock update accepted (Laravel major still needs migration)" >> "$GITHUB_STEP_SUMMARY" || {
            cp /tmp/server-composer-lock.json server/composer.lock
            echo "Composer lock update reverted (incompatible or unverified)" >> "$GITHUB_STEP_SUMMARY"
          }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Refresh Flutter within declared ranges and run tests
        shell: bash
        run: |
          cp mobile/pubspec.lock /tmp/mobile-pubspec.lock
          (
            cd mobile
            flutter pub upgrade
            flutter analyze
            flutter test
          ) && echo "Flutter compatible lock update accepted" >> "$GITHUB_STEP_SUMMARY" || {
            cp /tmp/mobile-pubspec.lock mobile/pubspec.lock
            echo "Flutter lock update reverted (native device verification still required)" >> "$GITHUB_STEP_SUMMARY"
          }
      - name: Commit only tested dependency lockfile changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv/package-lock.json server/package-lock.json server/composer.lock mobile/pubspec.lock
          if git diff --cached --quiet; then
            echo "No compatible tested dependency updates available" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh compatible npm, composer and Flutter locks after checks"
            git push origin HEAD:dependencies/safe-patch-refresh
          fi
