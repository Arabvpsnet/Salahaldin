name: Licensed Badini Quran translation — strict full source import
on:
  push:
    branches: [content/licensed-quran-media-2026-11]
    paths:
      - 'mobile/tools/import_badini_sanahi.py'
      - '.github/workflows/import-badini-sources.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-badini:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Import pinned Sanahi Badini source without editing verse text
        working-directory: mobile
        run: python3 tools/import_badini_sanahi.py
      - name: Verify Badini 114 surahs and all 13 existing QuranEnc editions
        working-directory: mobile
        run: |
          python3 tools/import_badini_sanahi.py --verify-only
          python3 tools/import_quranenc_translations.py --verify-only
      - name: Save structurally validated Badini edition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/assets/quran/badini/
          if ! git diff --cached --quiet; then
            git commit -m "Import verbatim Badini Sanahi 6,236-ayah source with provenance"
            git push origin HEAD:content/licensed-quran-media-2026-11
          fi
