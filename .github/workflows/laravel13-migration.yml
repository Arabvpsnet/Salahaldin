name: Laravel 13 migration — PHP 8.4 resolver and regression tests
on:
  push:
    branches: [upgrade/laravel13-lab]
    paths:
      - 'server/composer.json'
      - 'server/composer.lock'
      - 'server/app/**'
      - 'server/routes/**'
      - '.github/workflows/laravel13-migration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate-laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, pdo_mysql, bcmath, sqlite3, pdo_sqlite
          tools: composer:v2
      - name: Solve newest compatible Laravel 13 dependency graph
        working-directory: server
        run: composer update --no-interaction --no-scripts --no-plugins --with-all-dependencies --no-progress
      - name: Composer validation and security audit
        working-directory: server
        run: |
          composer validate --no-check-publish
          composer audit --locked
          php artisan --version
          php artisan route:list --json > /tmp/routes.json
          php artisan test --stop-on-failure
      - name: Commit validated migration lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "Resolve tested Laravel 13 Composer dependency lock"
            git push origin HEAD:upgrade/laravel13-lab
          fi
