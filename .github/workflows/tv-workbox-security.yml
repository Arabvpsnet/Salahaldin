name: TV Workbox transitive security override compatibility
on:
  push:
    branches: [upgrade/tv-audit-clean-lab]
    paths: ['tv/package.json', '.github/workflows/tv-workbox-security.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Resolve validated Workbox overrides and audit lock
        working-directory: tv
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=moderate
      - name: Commit only passing workbox transitive security fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv/package-lock.json
          git commit -m "Resolve patched Workbox glob and minimatch dependencies"
          git push origin HEAD:upgrade/tv-audit-clean-lab
